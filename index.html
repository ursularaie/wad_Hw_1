<!DOCTYPE html>
<html lang="en">
<!--looks okay with width 238px after that not-->

<head>
    <meta charset="UTF-8">
    <!--took away: <meta name="viewport" content="width=device-width, initial-scale=1.0"> because it messed with the phone layout-->
    <title>Home</title>
    <link href="res\css\style.css" rel="stylesheet" type="text/css">
    <script src="script.js" defer></script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <!-- credit for favion: https://www.flaticon.com/free-icons/marketing-->
</head>

<body>
    <header class="header" id="index_header">
        <nav class="nav-bar">
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li id="button_separator">|</li>
                <li><a href="addPost.html" class="nav-link">addPost</a></li>
            </ul>
        </nav>
        <img src="images/account.png" alt="profile" class="avatar">
        <!--credit for vector: https://www.flaticon.com/free-icons/user-->
    </header>
    <main id="main_content">
        <div id="rightside_column"></div>
        <div id="middle_column">
            <div id="posts"></div>
        </div>
        <div id="leftside_column"></div>
    </main>
    <footer id="footer">
        <p>Footer</p>
    </footer>
    <template class="post_template">
        <article class="post">
            <div class="post_header">
                <img src="" alt="profile picture" class="post_profile_pic">
                <p class="post_date"></p>
            </div>
            <div class="post_content">
                <div class="post_pic_div">
                            <img src="" alt="" class="post_pic">
                        </div>
                <p class="post_text"></p>
            </div>
            <div class="username"></div>
            <div class="like_button_div">
                <button class="like_button"><img src="images/thumbs-up.png" alt="like button" class="like_icon"></button> <!--no need for this to be taken from json becuase it's the same everywhere-->
                <!--credit for icon: https://www.flaticon.com/free-icons/thumbs-up-->
            </div>
        </article>
    </template>
</body>

</html>
